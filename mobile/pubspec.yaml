name: business_manager
description: Business Manager point of sale — works without a network connection.
publish_to: none
version: 1.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"   # Flutter 3.22 or newer

dependencies:
  flutter:
    sdk: flutter
  # Deliberately few packages: a small APK starts faster on low-end phones
  # and every extra package is one more thing that can break an update.
  sqflite: ^2.3.3          # local database (the app's source of truth while offline)
  path: ^1.9.0
  path_provider: ^2.1.3    # where the database and the image cache live
  http: ^1.2.1
  mobile_scanner: ^5.2.3   # barcode scanning in the app
  image_picker: ^1.1.2     # product photos from the camera
  flutter_image_compress: ^2.3.0
  flutter_secure_storage: ^9.2.2   # the device token

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
